<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Cyber Web City</title>
    <!-- Social media previews -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Cyber Web City">
    <meta property="og:description" content="A relaxing night flight through an enormous, rain-soaked, procedurally generated cyberpunk megacity.">
    <meta property="og:url" content="https://greggman.github.io/cyber-web-city/">
    <meta property="og:image" content="https://greggman.github.io/cyber-web-city/cyber-web-city.jpg">
    <meta property="og:image:width" content="1920">
    <meta property="og:image:height" content="1080">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Cyber Web City">
    <meta name="twitter:description" content="A relaxing night flight through an enormous, rain-soaked, procedurally generated cyberpunk megacity.">
    <meta name="twitter:image" content="https://greggman.github.io/cyber-web-city/cyber-web-city.jpg">
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      /* No pinch/double-tap zoom, text selection, long-press callouts or tap flashes. */
      html, body, canvas {
        touch-action: none;
        user-select: none; -webkit-user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      canvas { display: block; width: 100%; height: 100%; }
      #loadmsg {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        color: #7ff; font: 16px/1.4 ui-monospace, monospace; letter-spacing: 0.2em;
        text-shadow: 0 0 8px #0ff; pointer-events: none; text-align: center;
        white-space: pre-line;
      }
      #loadmsg.done { display: none; }
      #errors {
        position: fixed; left: 8px; right: 8px; bottom: 8px; max-height: 40%;
        overflow: auto; color: #f66; background: rgba(0, 0, 0, 0.8);
        font: 12px/1.3 ui-monospace, monospace; white-space: pre-wrap; display: none;
      }
      #hud {
        position: fixed; left: 10px; top: 56px; color: #9fc;
        font: 11px/1.3 ui-monospace, monospace; white-space: pre;
        text-shadow: 0 0 2px #000; pointer-events: none;
      }
      #help {
        position: fixed; right: 10px; bottom: 8px; color: rgba(200, 255, 255, 0.45);
        font: 11px ui-monospace, monospace; pointer-events: none;
      }
      @media (max-width: 640px), (hover: none) { #help { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="loadmsg">Loading</div>
    <div id="hud"></div>
    <div id="help">C: camera &nbsp; 1-5: framing (0: auto) &nbsp; Space: pause &nbsp; M: sound &nbsp; H: stats</div>
    <div id="errors"></div>
    <script type="module" src="main.js"></script>
  </body>
</html>
